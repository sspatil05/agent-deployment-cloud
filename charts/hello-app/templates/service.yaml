apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-app.name" . }}
  labels:
    {{- include "hello-app.labels" . | nindent 4 }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.internal }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hello-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
