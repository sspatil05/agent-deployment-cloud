apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-agent.name" . }}
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-agent.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.spreadAcrossNodes }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ai-agent.selectorLabels" . | nindent 20 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "ai-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: AGENT_NAME
              value: {{ include "ai-agent.name" . | quote }}
            - name: AGENT_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: AGENT_PORT
              value: {{ .Values.containerPort | quote }}
            {{- if .Values.llm.enabled }}
            - name: AGENT_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: AGENT_LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: {{ .Values.llm.apiKeyEnvName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.secretName }}
                  key: {{ .Values.llm.secretKey }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
