# Checks on every pull request. Nothing here touches Google Cloud.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app1, app2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        run: python -m unittest -v
      - name: Docker build (not pushed)
        run: docker build -t ${{ matrix.app }}:ci apps/${{ matrix.app }}

  helm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app1, app2]
        env: [dev, stage, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          ARGS="-f deploy/env/${{ matrix.env }}.yaml -f apps/${{ matrix.app }}/values.yaml --set image.repository=example/${{ matrix.app }} --set image.tag=ci"
          helm lint charts/hello-app $ARGS
          helm template ${{ matrix.app }} charts/hello-app $ARGS > /dev/null

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: |
          pip install --quiet "./agents/agent-core[anthropic,openrouter]" pytest
          pip install --quiet --no-deps ./agents/agent-starter
          (cd agents/agent-core && python -m pytest -q)
          (cd agents/agent-starter && python -m pytest -q tests)
      - name: Docker build (not pushed)
        run: docker build -f agents/Dockerfile -t agent-starter:ci agents

  agent-chart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, stage, prod]
        llm: ["false", "true"]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          ARGS="-f deploy/agents/${{ matrix.env }}.yaml --set image.repository=example/agent-starter --set image.tag=ci --set llm.enabled=${{ matrix.llm }}"
          helm lint charts/ai-agent $ARGS
          helm template agent-starter charts/ai-agent $ARGS > /dev/null
          # the publicly reachable variant (service.type LoadBalancer with allowed ranges)
          helm template agent-starter charts/ai-agent $ARGS --set service.type=LoadBalancer --set-json 'service.loadBalancerSourceRanges=["203.0.113.7/32"]' | grep -q loadBalancerSourceRanges

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate each environment
        run: |
          for env in dev stage prod; do
            terraform -chdir=envs/$env init -backend=false -input=false
            terraform -chdir=envs/$env validate
          done
